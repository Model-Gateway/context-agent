# Example configuration for a self-hosted OpenAI-compatible server.

[model]
name = "qwen2.5-coder-32b-instruct"
base_url = "http://localhost:8000/v1"
api_key_env = "LOCAL_MODEL_KEY"      # leave the variable unset for servers without auth
context_window = 32768
max_output_tokens = 4096
request_timeout_secs = 300
max_retries = 3

[model.capabilities]
streaming = true
tool_calling = true
parallel_tool_calls = false           # many local servers emit one call at a time
prompt_caching = "auto"
reasoning_controls = false

[permissions]
profile = "workspace_autonomous"
allowed_commands = ["npm test", "npm run lint", "cargo test", "pytest"]
denied_commands = ["git push", "rm -rf /"]
allow_network_commands = false

[validation]
commands = []                         # detected from the repository's build files
timeout_secs = 900

[context]
compaction_threshold = 0.7
keep_recent_turns = 6

[agent]
max_steps = 80
max_recovery_cycles = 3
command_timeout_secs = 600

[pricing]
input_per_million = 0.0
cached_input_per_million = 0.0
output_per_million = 0.0
