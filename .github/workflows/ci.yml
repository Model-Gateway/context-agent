name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  cli:
    name: ctx (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build ctx
        run: cargo build --release -p ctx-cli --target ${{ matrix.target }}
      - name: Test workspace
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Smoke-test the binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ctx${{ matrix.ext }}"
          "$bin" --version
          "$bin" --help > /dev/null
      - name: Upload ctx
        uses: actions/upload-artifact@v4
        with:
          name: ctx-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ctx${{ matrix.ext }}
          if-no-files-found: error
