name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Throwaway diagnostic: how long the serve test's index passes take on the
# Windows runner. Never merged.
jobs:
  cli:
    name: ctx (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: false
      - name: Serve tests under the usual parallel load, three times
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== parallel run $i"
            cargo test -p ctx-cli --test serve --target ${{ matrix.target }} -- --nocapture 2>&1 | grep -E "DIAG|test result|FAILED|panicked|must precede" || true
          done
      - name: The ordering test alone, twice
        shell: bash
        run: |
          for i in 1 2; do
            echo "=== alone run $i"
            cargo test -p ctx-cli --test serve --target ${{ matrix.target }} -- --nocapture --test-threads=1 indexing_runs_and_close_reopen_are_ordered 2>&1 | grep -E "DIAG|test result|FAILED|panicked|must precede" || true
          done
