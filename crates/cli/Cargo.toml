[package]
name = "ctx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Context command-line interface: interactive TUI, headless runs, index/context/memory/task inspection, evaluation, doctor."

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
ctx-core = { workspace = true }
ctx-agent = { workspace = true }
ctx-providers = { workspace = true }
ctx-tools = { workspace = true }
ctx-evaluation = { workspace = true }
ctx-indexing = { workspace = true }
ctx-lsp = { workspace = true }
ctx-storage = { workspace = true }
ctx-telemetry = { workspace = true }
ctx-context = { workspace = true }
ctx-retrieval = { workspace = true }
ctx-memory = { workspace = true }
ctx-security = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
ratatui = { workspace = true }
unicode-width = { workspace = true }
crossterm = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25", features = ["highsierra"] }
